<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>洛谷 Cookie 复制器</title>
<style>
  body { width: 260px; margin: 0; padding: 16px; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #0a0e14; color: #e6edf7; }
  h1 { font-size: 14px; margin: 0 0 12px; color: #4de68c; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #4de68c; color: #06220f; font-size: 14px; font-weight: 700; cursor: pointer; }
  button:hover { background: #7bf7b0; }
  p { font-size: 12px; line-height: 1.8; color: #8b9bb4; margin: 10px 0 0; }
  p.ok { color: #4de68c; font-weight: 700; }
  p.err { color: #ff6b6b; }
  .manual { word-break: break-all; color: #ffb454; }
</style>
</head>
<body>
  <h1>🐦 洛谷 Cookie 复制器</h1>
  <button id="copy">复制洛谷 Cookie</button>
  <p id="status">点击按钮，把洛谷 Cookie 复制到剪贴板</p>
  <script src="popup.js"></script>
</body>
</html>
